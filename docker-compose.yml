services:
  postgres:
    image: postgres:16-alpine
    container_name: opsbridge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsbridge}
      POSTGRES_USER: ${POSTGRES_USER:-opsbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsbridge_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opsbridge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsbridge-app
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opsbridge}
      DB_USERNAME: ${POSTGRES_USER:-opsbridge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-opsbridge_dev}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/incidents >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  opsbridge_data:
